services:
  backend:
    build: ./backend
    container_name: self-healing-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/database:/app/app/database
    environment:
      - OPENMETEO_GEO_URL=http://host.docker.internal:9001/v1/search
      - OPENMETEO_WEATHER_URL=http://host.docker.internal:9001/v1/forecast

  frontend:
    build: ./frontend
    container_name: self-healing-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_BASE=http://backend:8000
      - OPENMETEO_GATEWAY_URL=http://host.docker.internal:9001

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus